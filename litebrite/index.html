<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0a0a0c">
<title>LIT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --void: #050506;
    --shell: #141416;
    --shell-hi: #2a2a2e;
    --ink: #f4efe4;
    --mute: #a79d8c;
    --well: #070604;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--void);
    color: var(--ink);
    font-family: Nunito, ui-rounded, system-ui, sans-serif;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    overflow: hidden;
  }
  body {
    display: flex;
    flex-direction: column;
    min-height: 100dvh;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    padding: 12px 18px 4px;
  }
  h1 {
    margin: 0;
    font-family: Bungee, Impact, sans-serif;
    font-size: clamp(20px, 6vw, 28px);
    letter-spacing: 0.06em;
    font-weight: 400;
    line-height: 1;
    cursor: pointer;
  }
  h1 span { display: inline-block; }
  h1 .l { color: #14e8ff; text-shadow: 0 0 16px rgba(20, 232, 255, 0.7); }
  h1 .i { color: #ff2fb0; text-shadow: 0 0 16px rgba(255, 47, 176, 0.7); }
  h1 .t { color: #ffe014; text-shadow: 0 0 16px rgba(255, 224, 20, 0.7); }
  .hint {
    margin: 0;
    color: var(--mute);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.02em;
    text-shadow: 0 1px 2px rgba(0,0,0,0.85);
  }
  .box {
    position: relative;
    flex: 1;
    min-height: 0;
    margin: 8px 14px 12px;
    padding: 16px;
    border-radius: 36px;
    background:
      linear-gradient(128deg,
        #f7fafc 0%,
        #a8b2bc 7%,
        #eef3f7 14%,
        #6a7380 26%,
        #d8e0e8 38%,
        #8e98a4 50%,
        #f4f8fb 60%,
        #3c4550 76%,
        #c2ccd6 88%,
        #707986 100%);
    box-shadow:
      inset 0 2px 1px rgba(255,255,255,0.88),
      inset 0 -10px 18px rgba(18,22,28,0.38),
      0 1px 0 rgba(255,255,255,0.4),
      0 16px 34px rgba(0,0,0,0.55);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    animation: bezel-breathe 16s ease-in-out infinite;
  }
  .box::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    pointer-events: none;
    background:
      radial-gradient(120% 70% at 16% 6%, rgba(255,255,255,0.72), transparent 40%),
      linear-gradient(108deg,
        transparent 22%,
        rgba(255,255,255,0.4) 38%,
        rgba(255,255,255,0.04) 46%,
        rgba(20,24,30,0.14) 60%,
        transparent 74%);
    mix-blend-mode: soft-light;
  }
  .box::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    pointer-events: none;
    background: linear-gradient(100deg, transparent 36%, rgba(255,255,255,0.28) 50%, transparent 62%);
    background-size: 220% 100%;
    animation: bezel-sheen 14s ease-in-out infinite;
    opacity: 0.45;
  }
  @keyframes bezel-breathe {
    0%, 100% { border-radius: 32px; }
    50% { border-radius: 44px; }
  }
  @keyframes bezel-sheen {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }
  .screen {
    position: relative;
    z-index: 1;
    flex: 1;
    min-height: 0;
    border-radius: 18px;
    overflow: hidden;
    background: var(--well);
    box-shadow:
      inset 0 0 0 1px #050608,
      0 0 0 1px rgba(255,255,255,0.45),
      inset 0 24px 40px rgba(0,0,0,0.5);
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
    cursor: crosshair;
  }
  .zoom-tools {
    position: absolute;
    right: 8px;
    bottom: 8px;
    z-index: 2;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .zoom-tools button {
    appearance: none;
    width: 36px;
    height: 36px;
    border: 0;
    border-radius: 10px;
    background: rgba(8, 8, 10, 0.55);
    color: #f4efe4;
    font: 800 20px/1 Nunito, ui-rounded, system-ui, sans-serif;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.14);
    cursor: pointer;
  }
  .zoom-tools button:active { background: rgba(8, 8, 10, 0.8); }
  .share {
    position: absolute;
    inset: 0;
    z-index: 3;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 18px;
    background: rgba(5, 5, 6, 0.72);
  }
  .share.on { display: flex; }
  .share-card {
    width: min(72vw, 260px);
    background: #f4efe4;
    color: #120e08;
    border-radius: 18px;
    padding: 16px 16px 14px;
    text-align: center;
    box-shadow: 0 16px 40px rgba(0,0,0,0.5);
  }
  .share-card p {
    margin: 0;
    font-weight: 800;
    font-size: 15px;
  }
  .share-card span {
    display: block;
    margin: 4px 0 12px;
    font-size: 12px;
    font-weight: 700;
    color: #6a6256;
  }
  .share-card svg {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 8px;
  }
  .tray {
    padding: 2px 14px 14px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .pegs {
    display: flex;
    gap: 4px;
    justify-content: center;
    align-items: center;
    flex-wrap: nowrap;
  }
  .peg {
    appearance: none;
    border: 0;
    padding: 0;
    flex: 0 0 auto;
    width: 27px;
    height: 27px;
    border-radius: 50%;
    cursor: pointer;
    position: relative;
    background:
      radial-gradient(circle at 32% 28%, rgba(255,255,255,0.92), transparent 26%),
      radial-gradient(circle at 50% 55%, var(--peg) 0%, color-mix(in srgb, var(--peg) 68%, black) 72%, #141414 100%);
    box-shadow:
      0 0 0 2px #08080a,
      0 5px 0 #050506,
      0 0 18px color-mix(in srgb, var(--peg) 62%, transparent);
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .peg:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
  .peg[aria-pressed="true"] {
    transform: translateY(-4px) scale(1.08);
    box-shadow:
      0 0 0 3px #f4efe4,
      0 8px 0 #050506,
      0 0 26px color-mix(in srgb, var(--peg) 88%, transparent);
  }
  .peg.pull {
    color: transparent;
    font-size: 0;
    line-height: 0;
    background:
      radial-gradient(circle at 50% 50%, rgba(255, 220, 150, 0.55) 0%, rgba(255, 176, 70, 0.16) 36%, rgba(16, 12, 8, 0) 68%),
      #100c08;
    box-shadow:
      0 0 0 2px #08080a,
      0 5px 0 #050506,
      inset 0 0 7px rgba(0, 0, 0, 0.5);
  }
  .peg.pull[aria-pressed="true"] {
    box-shadow:
      0 0 0 3px #f4efe4,
      0 8px 0 #050506,
      inset 0 0 7px rgba(0, 0, 0, 0.5),
      0 0 18px rgba(255, 196, 90, 0.32);
  }
  .peg.ink {
    background:
      radial-gradient(circle at 32% 28%, rgba(220,226,232,0.55), transparent 28%),
      radial-gradient(circle at 50% 55%, #4a4e56 0%, #1a1c20 78%, #0a0a0c 100%);
    box-shadow:
      0 0 0 2px #08080a,
      0 5px 0 #050506,
      0 0 10px rgba(160,170,180,0.18);
  }
  .tools {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr 1fr;
    gap: 8px;
  }
  .tool {
    appearance: none;
    border: 0;
    height: 40px;
    border-radius: 14px;
    background: #161618;
    color: var(--ink);
    font-family: inherit;
    font-weight: 800;
    font-size: 13px;
    letter-spacing: 0.02em;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.07);
    cursor: pointer;
  }
  .tool:active { transform: translateY(1px); }
  .tool[aria-pressed="true"] {
    background: #2a2418;
    box-shadow: inset 0 0 0 1px #e3b341;
    color: #f2d48a;
  }
  .tool.danger:active { background: #3a1515; }
  @media (min-width: 720px) {
    .peg { width: 48px; height: 48px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .peg { transition: none; }
    .box, .box::after { animation: none; }
  }
</style>

<body>

h4m1 0h1m3 0h1"/></svg>
        </div>
      </div>
    </div>
  </div>

  <div class="tray">
    <div class="pegs" role="listbox" aria-label="LED colors" id="pegsClassic"></div>
    <div class="tools">
      <button class="tool" id="density" type="button" aria-pressed="false">Big pegs</button>
      <button class="tool" id="undo" type="button">Undo</button>
      <button class="tool" id="save" type="button">Save</button>
      <button class="tool danger" id="clear" type="button">Clear</button>
    </div>
  </div>

<script>
(function () {
  const COLORS = [
    { id: "red",    hex: "#ff1a14" },
    { id: "orange", hex: "#ff7a00" },
    { id: "yellow", hex: "#ffe014" },
    { id: "green",  hex: "#2dff3c" },
    { id: "cyan",   hex: "#14e8ff" },
    { id: "blue",   hex: "#2f6bff" },
    { id: "violet", hex: "#b44dff" },
    { id: "hot",    hex: "#ff2fb0" },
    { id: "white",  hex: "#f6f7ff" },
    { id: "black",  hex: "#3c4148" }
  ];
  const STORE = "hoodwinked.peglight.v1";
  const canvas = document.getElementById("board");
  const ctx = canvas.getContext("2d");
  const pegsClassic = document.getElementById("pegsClassic");
  const hint = document.getElementById("hint");
  const densityBtn = document.getElementById("density");
  const undoBtn = document.getElementById("undo");
  const saveBtn = document.getElementById("save");
  const clearBtn = document.getElementById("clear");

  const state = {
    color: "red",
    density: "fine",
    holes: [],
    cols: 0,
    rows: 0,
    radius: 8,
    pitch: 18,
    undo: [],
    painting: false,
    lastIndex: -1,
    clearArmed: false,
    densityArmed: false,
    dragArmed: false,
    downX: 0,
    downY: 0,
    viewW: 1,
    viewH: 1,
    dpr: 1,
    zoom: 1,
    panX: 0,
    panY: 0,
    pinching: false,
    pinch: null,
    suppressPaint: false
  };
  const pointers = new Map();
  const MIN_ZOOM = 1;
  const MAX_ZOOM = 3.75;

  function resolveColor(id) {
    const alias = { pink: "hot", magenta: "hot", grey: "black", gray: "black", charcoal: "black", graphite: "black" };
    if (alias[id]) id = alias[id];
    return COLORS.find((c) => c.id === id) || null;
  }

  function addPeg(c, parent) {
    const b = document.createElement("button");
    b.className = "peg";
    b.type = "button";
    b.style.setProperty("--peg", c.hex);
    b.dataset.id = c.id;
    if (c.id === "black") b.classList.add("ink");
    b.setAttribute("role", "option");
    b.setAttribute("aria-label", c.id === "hot" ? "magenta" : c.id);
    b.setAttribute("aria-pressed", c.id === state.color ? "true" : "false");
    b.addEventListener("click", () => selectColor(c.id));
    parent.appendChild(b);
  }
  COLORS.forEach((c) => addPeg(c, pegsClassic));
  const pull = document.createElement("button");
  pull.className = "peg pull";
  pull.type = "button";
  pull.dataset.id = "pull";
  pull.setAttribute("aria-label", "Pull peg");
  pull.setAttribute("aria-pressed", "false");
  pull.addEventListener("click", () => selectColor(null));
  pegsClassic.appendChild(pull);

  function densityLabel() {
    return state.density === "coarse" ? "Little pegs" : "Big pegs";
  }

  function disarmConfirms() {
    state.clearArmed = false;
    state.densityArmed = false;
    clearBtn.textContent = "Clear";
    densityBtn.textContent = densityLabel();
  }

  function hasArt() {
    return state.holes.some((h) => h.color);
  }

  function selectColor(id) {
    const spec = id === null ? null : resolveColor(id);
    state.color = spec ? spec.id : null;
    disarmConfirms();
    if (state.color === null) {
      hint.textContent = "Pull a peg";
      hint.style.color = "";
    } else if (state.color === "black") {
      hint.textContent = "Plug a hole";
      hint.style.color = "#f6f7ff";
    } else {
      const name = state.color === "hot" ? "magenta" : state.color;
      hint.textContent = "Lite it " + name;
      hint.style.color = state.color === "white" ? "#f6f7ff" : spec.hex;
    }
    document.querySelectorAll(".peg").forEach((el) => {
      const isOn = (state.color === null && el.dataset.id === "pull") || el.dataset.id === state.color;
      el.setAttribute("aria-pressed", isOn ? "true" : "false");
    });
  }

  function hexToRgb(hex) {
    const n = parseInt(hex.slice(1), 16);
    return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
  }

  function layout() {
    const rect = canvas.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    const cssW = Math.max(1, rect.width);
    const cssH = Math.max(1, rect.height);
    canvas.width = Math.round(cssW * dpr);
    canvas.height = Math.round(cssH * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    state.viewW = cssW;
    state.viewH = cssH;
    state.dpr = dpr;

    const coarse = state.density === "coarse";
    const pad = coarse ? 14 : 10;
    const minPitch = coarse ? 28 : 16;
    const availW = Math.max(1, cssW - pad * 2);
    const availH = Math.max(1, cssH - pad * 2);
    const cols = Math.max(8, Math.floor(availW / minPitch));
    const pitch = availW / Math.max(cols - 0.5, 1);
    const rowPitch = pitch * 0.86;
    const rows = Math.max(10, Math.floor(availH / rowPitch) + 1);
    const usedW = (cols - 1) * pitch;
    const usedH = (rows - 1) * rowPitch;
    const ox = (cssW - usedW) / 2;
    const oy = Math.max(pad * 0.4, (cssH - usedH) / 2);
    const radius = pitch * 0.34;

    const prev = new Map();
    state.holes.forEach((h) => {
      if (h.color) prev.set(h.r + "," + h.c, h.color);
    });

    const holes = [];
    for (let r = 0; r < rows; r++) {
      const odd = r % 2;
      const n = cols - odd;
      const x0 = ox + odd * (pitch / 2);
      for (let c = 0; c < n; c++) {
        holes.push({
          r, c,
          x: x0 + c * pitch,
          y: oy + r * rowPitch,
          color: prev.get(r + "," + c) || null
        });
      }
    }
    state.holes = holes;
    state.cols = cols;
    state.rows = rows;
    state.radius = radius;
    state.pitch = pitch;
    clampCamera();
    draw();
  }

  function drawHole(h) {
    const { x, y } = h;
    const rad = state.radius;
    if (!h.color) {
      ctx.beginPath();
      ctx.fillStyle = "#100c08";
      ctx.arc(x, y, rad, 0, Math.PI * 2);
      ctx.fill();
      const leak = ctx.createRadialGradient(x, y, 0, x, y, rad);
      leak.addColorStop(0, "rgba(255, 220, 150, 0.38)");
      leak.addColorStop(0.42, "rgba(255, 176, 70, 0.12)");
      leak.addColorStop(1, "rgba(0,0,0,0)");
      ctx.beginPath();
      ctx.fillStyle = leak;
      ctx.arc(x, y, rad, 0, Math.PI * 2);
      ctx.fill();
      return;
    }
    const spec = resolveColor(h.color);
    if (!spec) return;
    const rgb = hexToRgb(spec.hex);
    if (spec.id === "black") {
      const plug = ctx.createRadialGradient(x - rad * 0.28, y - rad * 0.32, rad * 0.08, x, y, rad);
      plug.addColorStop(0, "rgba(170,178,188,0.7)");
      plug.addColorStop(0.22, "rgba(70,76,84,1)");
      plug.addColorStop(0.72, "rgba(28,30,34,1)");
      plug.addColorStop(1, "rgba(8,8,10,1)");
      ctx.beginPath();
      ctx.fillStyle = plug;
      ctx.arc(x, y, rad, 0, Math.PI * 2);
      ctx.fill();
      return;
    }
    const glowR = rad * 2.45;
    const glow = ctx.createRadialGradient(x, y, rad * 0.12, x, y, glowR);
    glow.addColorStop(0, "rgba(" + rgb.r + "," + rgb.g + "," + rgb.b + ",1)");
    glow.addColorStop(0.36, "rgba(" + rgb.r + "," + rgb.g + "," + rgb.b + ",0.46)");
    glow.addColorStop(1, "rgba(" + rgb.r + "," + rgb.g + "," + rgb.b + ",0)");
    ctx.beginPath();
    ctx.fillStyle = glow;
    ctx.arc(x, y, glowR, 0, Math.PI * 2);
    ctx.fill();

    const body = ctx.createRadialGradient(x - rad * 0.28, y - rad * 0.32, rad * 0.08, x, y, rad);
    body.addColorStop(0, "rgba(255,255,255,0.98)");
    body.addColorStop(0.2, "rgba(" + rgb.r + "," + rgb.g + "," + rgb.b + ",1)");
    body.addColorStop(0.76, "rgba(" + Math.round(rgb.r * 0.52) + "," + Math.round(rgb.g * 0.52) + "," + Math.round(rgb.b * 0.52) + ",1)");
    body.addColorStop(1, "rgba(16,12,10,0.95)");
    ctx.beginPath();
    ctx.fillStyle = body;
    ctx.arc(x, y, rad, 0, Math.PI * 2);
    ctx.fill();
  }

  function clampCamera() {
    const z = state.zoom = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, state.zoom));
    const w = state.viewW;
    const h = state.viewH;
    if (z <= 1.001) {
      state.zoom = 1;
      state.panX = 0;
      state.panY = 0;
      return;
    }
    state.panX = Math.min(0, Math.max(w * (1 - z), state.panX));
    state.panY = Math.min(0, Math.max(h * (1 - z), state.panY));
  }

  function zoomAt(sx, sy, nextZ) {
    const z0 = state.zoom || 1;
    const z1 = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, nextZ));
    state.panX = sx - (sx - state.panX) * (z1 / z0);
    state.panY = sy - (sy - state.panY) * (z1 / z0);
    state.zoom = z1;
    clampCamera();
    draw();
  }

  function resetCamera() {
    state.zoom = 1;
    state.panX = 0;
    state.panY = 0;
  }

  function worldFromScreen(p) {
    return {
      x: (p.x - state.panX) / state.zoom,
      y: (p.y - state.panY) / state.zoom
    };
  }

  function livePinch() {
    const pts = Array.from(pointers.values());
    if (pts.length < 2) return null;
    return {
      cx: (pts[0].x + pts[1].x) / 2,
      cy: (pts[0].y + pts[1].y) / 2,
      dist: Math.max(1, Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y))
    };
  }

  function draw() {
    const w = state.viewW;
    const h = state.viewH;
    ctx.setTransform(state.dpr, 0, 0, state.dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);
    ctx.translate(state.panX, state.panY);
    ctx.scale(state.zoom, state.zoom);
    const x0 = -state.panX / state.zoom;
    const y0 = -state.panY / state.zoom;
    const bw = w / state.zoom;
    const bh = h / state.zoom;
    const back = ctx.createRadialGradient(
      x0 + bw * 0.5, y0 + bh * 0.4, 16,
      x0 + bw * 0.5, y0 + bh * 0.52, Math.max(bw, bh) * 0.74
    );
    back.addColorStop(0, "#2a1c0c");
    back.addColorStop(0.42, "#120e08");
    back.addColorStop(1, "#070604");
    ctx.fillStyle = back;
    ctx.fillRect(x0, y0, bw, bh);
    for (const hole of state.holes) drawHole(hole);
  }

  function nearest(px, py) {
    if (!state.holes.length) return -1;
    let best = 0;
    let bestD = Infinity;
    for (let i = 0; i < state.holes.length; i++) {
      const hole = state.holes[i];
      const d = Math.hypot(hole.x - px, hole.y - py);
      if (d < bestD) {
        bestD = d;
        best = i;
      }
    }
    return best;
  }

  function apply(index) {
    if (index < 0) return;
    const hole = state.holes[index];
    const next = state.color;
    if (hole.color === next) return;
    if (next !== null && hole.color) return;
    state.undo.push({ i: index, prev: hole.color });
    if (state.undo.length > 400) state.undo.shift();
    hole.color = next;
    draw();
    persist();
  }

  function pointerPos(e) {
    const rect = canvas.getBoundingClientRect();
    const t = e.touches ? e.touches[0] : e;
    return { x: t.clientX - rect.left, y: t.clientY - rect.top };
  }

  function down(e) {
    e.preventDefault();
    const p = pointerPos(e);
    if (e.pointerId != null) pointers.set(e.pointerId, p);
    if (canvas.setPointerCapture && e.pointerId != null) {
      try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
    }
    if (pointers.size >= 2) {
      if (state.painting && !state.dragArmed) {
        const last = state.undo.pop();
        if (last) {
          state.holes[last.i].color = last.prev;
          persist();
        }
      }
      state.painting = false;
      state.dragArmed = false;
      state.pinching = true;
      const live = livePinch();
      state.pinch = live
        ? { zoom: state.zoom, panX: state.panX, panY: state.panY, cx: live.cx, cy: live.cy, dist: live.dist }
        : null;
      draw();
      return;
    }
    if (state.suppressPaint || state.pinching) return;
    state.painting = true;
    state.dragArmed = false;
    const wpos = worldFromScreen(p);
    state.downX = wpos.x;
    state.downY = wpos.y;
    const i = nearest(wpos.x, wpos.y);
    state.lastIndex = i;
    apply(i);
  }
  function move(e) {
    if (e.pointerId != null && pointers.has(e.pointerId)) {
      pointers.set(e.pointerId, pointerPos(e));
    }
    if (state.pinching) {
      e.preventDefault();
      const live = livePinch();
      const start = state.pinch;
      if (!live || !start) return;
      const z = start.zoom * (live.dist / start.dist);
      const worldX = (start.cx - start.panX) / start.zoom;
      const worldY = (start.cy - start.panY) / start.zoom;
      state.zoom = z;
      state.panX = live.cx - worldX * z;
      state.panY = live.cy - worldY * z;
      clampCamera();
      draw();
      return;
    }
    if (!state.painting) return;
    e.preventDefault();
    const p = worldFromScreen(pointerPos(e));
    if (!state.dragArmed) {
      if (Math.hypot(p.x - state.downX, p.y - state.downY) < Math.max(10 / state.zoom, state.pitch * 0.45)) return;
      state.dragArmed = true;
    }
    const i = nearest(p.x, p.y);
    if (i !== state.lastIndex) {
      state.lastIndex = i;
      apply(i);
    }
  }
  function up(e) {
    if (e && e.pointerId != null) pointers.delete(e.pointerId);
    else pointers.clear();
    if (state.pinching && pointers.size < 2) {
      state.pinching = false;
      state.pinch = null;
      state.suppressPaint = pointers.size > 0;
    }
    if (pointers.size === 0) {
      state.suppressPaint = false;
      state.pinching = false;
      state.pinch = null;
    }
    state.painting = false;
    state.dragArmed = false;
  }

  canvas.addEventListener("pointerdown", down);
  canvas.addEventListener("pointermove", move);
  window.addEventListener("pointerup", up);
  window.addEventListener("pointercancel", up);

  function persist() {
    const cells = {};
    state.holes.forEach((h) => {
      if (h.color && resolveColor(h.color)) cells[h.r + "," + h.c] = h.color;
    });
    localStorage.setItem(STORE, JSON.stringify({
      density: state.density,
      color: state.color,
      cells
    }));
  }

  function restore() {
    try {
      const raw = localStorage.getItem(STORE);
      if (!raw) return null;
      return JSON.parse(raw);
    } catch (e) {
      return null;
    }
  }

  const saved = restore();
  if (saved) {
    if (saved.density === "coarse" || saved.density === "fine") state.density = saved.density;
    if (saved.color === null || COLORS.some((c) => c.id === saved.color)) selectColor(saved.color);
  } else {
    selectColor(state.color);
  }
  densityBtn.setAttribute("aria-pressed", state.density === "coarse" ? "true" : "false");
  densityBtn.textContent = state.density === "coarse" ? "Little pegs" : "Big pegs";

  function plantDemo() {
    const midR = Math.floor(state.rows / 2);
    const midC = Math.floor(state.cols / 2);
    const start = midC - Math.floor(COLORS.length / 2);
    COLORS.forEach((c, i) => {
      const hole = state.holes.find((h) => h.r === midR && h.c === start + i);
      if (hole) hole.color = c.id;
    });
    COLORS.forEach((c, i) => {
      const hole = state.holes.find((h) => h.r === midR + 2 && h.c === start + i);
      if (hole) hole.color = c.id;
    });
    draw();
  }

  densityBtn.addEventListener("click", () => {
    state.clearArmed = false;
    clearBtn.textContent = "Clear";
    if (hasArt() && !state.densityArmed) {
      state.densityArmed = true;
      densityBtn.textContent = "You sure?";
      setTimeout(() => {
        if (state.densityArmed) {
          state.densityArmed = false;
          densityBtn.textContent = densityLabel();
        }
      }, 2200);
      return;
    }
    state.densityArmed = false;
    state.density = state.density === "coarse" ? "fine" : "coarse";
    densityBtn.setAttribute("aria-pressed", state.density === "coarse" ? "true" : "false");
    densityBtn.textContent = densityLabel();
    state.holes.forEach((h) => { h.color = null; });
    state.undo = [];
    resetCamera();
    persist();
    layout();
  });

  undoBtn.addEventListener("click", () => {
    const last = state.undo.pop();
    if (!last) return;
    state.holes[last.i].color = last.prev;
    draw();
    persist();
  });

  clearBtn.addEventListener("click", () => {
    state.densityArmed = false;
    densityBtn.textContent = densityLabel();
    if (!state.clearArmed) {
      state.clearArmed = true;
      clearBtn.textContent = "You sure?";
      setTimeout(() => {
        if (state.clearArmed) {
          state.clearArmed = false;
          clearBtn.textContent = "Clear";
        }
      }, 2200);
      return;
    }
    state.clearArmed = false;
    clearBtn.textContent = "Clear";
    state.undo = [];
    state.holes.forEach((h) => { h.color = null; });
    draw();
    persist();
  });

  saveBtn.addEventListener("click", () => {
    const z = state.zoom;
    const x = state.panX;
    const y = state.panY;
    resetCamera();
    draw();
    const a = document.createElement("a");
    a.download = "lit.png";
    a.href = canvas.toDataURL("image/png");
    a.click();
    state.zoom = z;
    state.panX = x;
    state.panY = y;
    clampCamera();
    draw();
  });

  document.getElementById("zoomIn").addEventListener("click", () => {
    zoomAt(state.viewW / 2, state.viewH / 2, state.zoom * 1.28);
  });
  document.getElementById("zoomOut").addEventListener("click", () => {
    zoomAt(state.viewW / 2, state.viewH / 2, state.zoom / 1.28);
  });
  canvas.addEventListener("wheel", (e) => {
    e.preventDefault();
    const p = pointerPos(e);
    zoomAt(p.x, p.y, state.zoom * Math.exp(-e.deltaY * 0.0015));
  }, { passive: false });

  const wordmark = document.getElementById("wordmark");
  const share = document.getElementById("share");
  function setShare(on) {
    share.classList.toggle("on", on);
    share.setAttribute("aria-hidden", on ? "false" : "true");
    wordmark.setAttribute("aria-expanded", on ? "true" : "false");
  }
  wordmark.addEventListener("click", (e) => {
    e.stopPropagation();
    setShare(!share.classList.contains("on"));
  });
  wordmark.addEventListener("keydown", (e) => {
    if (e.key === "Enter" || e.key === " ") {
      e.preventDefault();
      setShare(!share.classList.contains("on"));
    }
  });
  share.addEventListener("click", () => setShare(false));
  window.addEventListener("keydown", (e) => {
    if (e.key === "Escape") setShare(false);
  });
  if (/\bshare=1\b/.test(location.search)) setShare(true);

  const ro = new ResizeObserver(() => layout());
  ro.observe(canvas);
  layout();
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(() => layout());
  }

  if (saved && saved.cells) {
    state.holes.forEach((h) => {
      const k = h.r + "," + h.c;
      if (saved.cells[k] && resolveColor(saved.cells[k])) h.color = saved.cells[k];
    });
    draw();
  } else if (/\bdemo=1\b/.test(location.search)) {
    plantDemo();
  }
})();
</script>
</body>
</html>
