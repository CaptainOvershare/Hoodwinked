function sayBruh(){if(!sound)return false;try{bruhAudio.pause();bruhAudio.currentTime=0;bruhAudio.play().catch(()=>{if(sound){tone(220,.14,0,'triangle',.2,145);tone(145,.2,.15,'triangle',.18,95)}});return true}catch{return false}}
function rejectAnswer(duplicate){clearReject();$('answerFeedback').textContent=duplicate?'BRUH. 😩 Already used! Try another.':'BRUH. 😩 Not in our answer bank. Try again!';$('answer').setAttribute('aria-invalid','true');void $('answerform').offsetWidth;$('answerform').classList.add('rejected');$('app').classList.add('answer-rejected');if(!sayBruh()){tone(220,.14,0,'triangle',.2,145);tone(145,.2,.15,'triangle',.18,95)}if(navigator.vibrate)navigator.vibrate(70);rejectTimer=setTimeout(()=>$('app').classList.remove('answer-rejected'),420)}
function cue(){if(navigator.vibrate)navigator.vibrate([100,50,100]);if(sound&&audio){try{const o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=740;g.gain.setValueAtTime(.12,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.2);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+.22)}catch{}}}
function render(){hide('home',true);hide('leave',false);hide('lobby',s.status!=='lobby');hide('game',s.status==='lobby');if(s.status==='lobby'){$('app').dataset.mode='';$('code').textContent=code;$('code').classList.toggle('legacy',code.length>4);showInviteQR();showPlayers('lobbyplayers',true);const host=s.host===uid,ready=s.players.length>=2;hide('start',!host);$('start').disabled=!ready;$('start').textContent=ready?'START GAME 🔥':'WAITING FOR PLAYERS';hide('waiting',false);$('waiting').textContent=host?(ready?s.players.length+' players ready — tap Start Game!':'Invite at least one more player to start.'):'Waiting for the host to start · '+s.players.length+' joined';return}
const me=s.players.find(p=>p.id===uid),active=s.players.find(p=>p.id===s.active),mine=s.status==='playing'&&s.active===uid,finished=s.status==='finished';$('app').dataset.mode=me?.lives===0?'spectator':mine?'active':'waiting';$('round').textContent=finished?'GAME OVER':'ROUND '+s.round+' · '+(me?.lives===0?'SPECTATING':'');$('turn').textContent=finished?'🏆 '+(s.players.find(p=>p.id===s.winner)?.name||'Nobody')+' WINS!':mine?'YOUR TURN!':(active?.name||'')+'’S TURN';$('question').textContent=finished?'GG! 🙌':s.question;$('score').textContent=me?'♥ '+me.lives+'   ·   '+me.points+' pts   ·   '+me.progress+'/500 next life':'';showPlayers('players');$('message').textContent=(s.message||'')+(s.message?.startsWith('🤯 RARE!')&&s.used.at(-1)?.points===100?' · Low-key legendary.':'');$('typing').textContent=mine?'':(s.typing||'…');hide('typing',mine||finished);hide('answerform',!mine);$('reaction').textContent=s.reaction?s.reaction.emoji+' '+s.reaction.name:'';const h=$('history');h.replaceChildren();for(const a of [...s.used].reverse()){const r=node('div','','entry');r.append(node('span',a.answer+' · '+a.name),node('b','+'+a.points));h.append(r)}if(s.turn!==turnSeen){clearReject();turnSeen=s.turn;$('answer').value='';clearTimeout(typingTimer);err('');if(mine)cue();else $('answer').blur()}updateClock()}
function updateClock(){if(!s||s.status!=='playing'){$('timer').textContent='—';$('timebar').style.width='0%';return}const left=Math.max(0,s.deadline-Date.now());$('timer').textContent=Math.min(s.seconds,Math.ceil(left/1000));$('timebar').style.width=Math.min(100,left/(s.seconds*10))+'%';if(left===0&&!tickBusy){tickBusy=true;rpc('tick').catch(e=>err(e.message)).finally(()=>setTimeout(()=>tickBusy=false,300))}}
async function connect(){if(channel)await db.removeChannel(channel);clearInterval(poll);channel=db.channel('lit:'+code).on('postgres_changes',{event:'UPDATE',schema:'public',table:'lit_rooms',filter:'code=eq.'+code},p=>accept(p.new.state)).subscribe();poll=setInterval(()=>{if(code)rpc('state').catch(e=>err(e.message))},1800);localStorage.setItem('lit-party-room',code)}
async function enter(a){if(busy)return;unlockAudio();busy=true;err('');try{await login();if(a==='join'){code=$('room').value.trim().toUpperCase();if(!/^(?:[A-HJ-NP-Z]{4}|[0-9A-F]{8})$/.test(code))throw Error('Enter the four-letter room code.');}await rpc(a,$('nickname').value.trim(),Number($('seconds').value));await connect()}catch(e){err(e.message)}finally{busy=false}}
$('create').onclick=()=>enter('create');$('join').onclick=()=>enter('join');$('start').onclick=()=>rpc('start').catch(e=>err(e.message));$('share').onclick=async()=>{try{await navigator.clipboard.writeText(inviteURL());err('Invite copied!')}catch{err('Room code: '+code)}};$('leave').onclick=()=>{roomEpoch++;if(channel)db.removeChannel(channel);clearInterval(poll);clearTimeout(typingTimer);localStorage.removeItem('lit-party-room');clearReject();s=null;code='';qrRoom='';turnSeen=-1;timeoutSeen=0;clearTimeout(fxTimer);hide('timeoutFX',true);$('app').dataset.mode='';hide('game',true);hide('lobby',true);hide('home',false);hide('leave',true);err('')};
$('answer').oninput=()=>{clearReject();clearTimeout(typingTimer);const t=s?.turn,v=$('answer').value;typingTimer=setTimeout(()=>{if(s?.active===uid&&s.turn===t)rpc('type',v,20,t).catch(e=>err(e.message))},180)};
$('answerform').onsubmit=async e=>{e.preventDefault();unlockAudio();if(busy||s?.active!==uid)return;const v=$('answer').value.trim();if(!v)return;clearTimeout(typingTimer);busy=true;try{const r=await rpc('answer',v);if(r?.result==='invalid'||r?.result==='duplicate'){if(s?.active===uid)rejectAnswer(r.result==='duplicate');err('')}else{clearReject();err('')}}catch(e){err(e.message)}finally{busy=false}};
for(const emoji of ['🔥','🤯','🫣','🫡','😭','😩','🙌','🏆']){const b=node('button',emoji);b.setAttribute('aria-label','React '+emoji);b.onclick=()=>rpc('reaction',emoji).catch(e=>err(e.message));$('reactions').append(b)}
function showSound(){ $('sound').textContent=sound?'🔊':'🔇';$('sound').setAttribute('aria-pressed',String(sound))}showSound();$('sound').onclick=()=>{sound=!sound;localStorage.setItem('lit-party-sound',sound?'on':'off');showSound();if(sound)unlockAudio();else bruhAudio.pause()};document.addEventListener('pointerdown',unlockAudio,{passive:true});
function resize(){const viewport=window.visualViewport;if(viewport&&Math.abs(viewport.scale-1)>.02)return;const h=viewport?.height||innerHeight;document.documentElement.style.setProperty('--vh',h+'px');document.body.classList.toggle('compact',h<540)}window.visualViewport?.addEventListener('resize',resize);window.addEventListener('resize',resize);resize();setInterval(updateClock,100);$('room').value=new URLSearchParams(location.search).get('room')||'';const saved=localStorage.getItem('lit-party-room');if(saved&&!$('room').value){(async()=>{try{await login();code=saved;await rpc('state');await connect()}catch{localStorage.removeItem('lit-party-room');code=''}})()}
</script></body></html>
