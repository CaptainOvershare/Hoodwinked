<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content"><meta name="theme-color" content="#050506"><title>LIT! — Hoodwinked</title><link href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet"><style>
:root{--c:#14e8ff;--m:#ff2fb0;--y:#ffe014;--bg:#050506;--ink:#f4efe4;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:800 18px Nunito,system-ui,sans-serif}main{width:min(100%,620px);height:var(--vh,100dvh);margin:auto;display:flex;flex-direction:column;padding:12px 16px max(12px,env(safe-area-inset-bottom));gap:10px}h1,h2,p{margin:0}h1,h2,.display{font-family:Bungee,Impact,sans-serif;font-weight:400}h1{font-size:clamp(48px,13vw,88px);letter-spacing:-.04em;text-align:center}h1 span:nth-child(1){color:var(--c)}h1 span:nth-child(2){color:var(--m)}h1 span:nth-child(3){color:var(--y)}button,input,select{font:inherit;border-radius:12px;border:1px solid #555;background:#141416;color:var(--ink);padding:12px;min-height:48px}button{cursor:pointer}button.primary{background:var(--c);color:#050506;border-color:var(--c)}button:disabled{opacity:.45;cursor:default}input{width:100%;font-size:20px}label{display:block;margin-top:10px}.row{display:flex;gap:8px;align-items:center}.row>*{min-width:0}.grow{flex:1}.panel{border:2px solid #444;background:#141416;border-radius:18px;padding:12px}.center{text-align:center}.small{font-size:14px;color:#c1c1c9}.turn{font-size:clamp(25px,7.5vw,46px);line-height:1.16;overflow-wrap:anywhere;text-align:center;color:var(--m)}main[data-mode=active]{border:4px solid var(--c);padding:8px 12px;box-shadow:inset 0 0 28px #14e8ff30}main[data-mode=active] .turn{color:var(--c)}main[data-mode=spectator] .turn{color:#b7b7bf}main[data-mode=spectator] .playerbar{filter:grayscale(1)}.timer{font:400 clamp(50px,15vw,100px)/1 Bungee,Impact,sans-serif;text-align:center;color:var(--y);font-variant-numeric:tabular-nums}.track{height:8px;border-radius:6px;background:#303036;overflow:hidden}.track>div{height:100%;background:var(--y);transition:width .12s linear}.question{font-size:clamp(23px,6vw,36px);line-height:1.15;text-align:center;overflow-wrap:anywhere}.scroll{min-height:0;flex:1;overflow:auto;overscroll-behavior:contain}.playerbar{display:flex;gap:7px;overflow:auto;padding:3px 0}.player{min-width:95px;max-width:160px;border:1px solid #414148;padding:6px 8px;border-radius:10px;font-size:14px;overflow-wrap:anywhere}.player.on{border:2px solid var(--c)}.player.out{opacity:.55}.hearts{color:var(--m);letter-spacing:2px}.emoji{display:flex;justify-content:space-between;gap:3px}.emoji button{border:0;padding:4px;font-size:23px;min-height:40px;background:none}.entry{padding:7px 0;display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid #303036}.entry b{color:var(--y)}.err{color:var(--y);min-height:22px;font-size:15px}.typing{min-height:48px;overflow-wrap:anywhere;font-size:24px}.hidden{display:none!important}#game{display:flex;flex:1;min-height:0;flex-direction:column;gap:8px}.compact .timer{font-size:42px}.compact .turn{font-size:24px}.compact .question{font-size:22px}.compact .playerbar,.compact .emoji,.compact #history,.compact #reaction{display:none}.compact #game{gap:4px}.compact main{gap:4px}.compact .scroll{flex:1}.compact #score{font-size:12px}#home,#lobby{overflow:auto}.code{font-size:36px;letter-spacing:.12em;color:var(--y)}@media(max-height:540px){.timer{font-size:42px}.turn{font-size:24px}.question{font-size:22px}.playerbar,.emoji,#history,#reaction{display:none}}:focus-visible{outline:3px solid var(--y);outline-offset:2px}
#invitecard{margin:12px 0;padding:14px;border:2px solid transparent;border-radius:18px;background:linear-gradient(#141416,#141416) padding-box,linear-gradient(120deg,var(--c),var(--m),var(--y)) border-box;text-align:center}#inviteqr{display:block;width:min(100%,240px);height:auto;aspect-ratio:1;margin:12px auto;background:#fff;image-rendering:pixelated;border-radius:4px}#invitecard .small{margin:4px 0 10px}#invitecard h3{font-size:22px;margin:0;color:var(--c)}#qrstatus{min-height:20px}.code{font-size:clamp(52px,18vw,104px);line-height:1.12;letter-spacing:.08em;text-shadow:0 0 20px #ffe01455;overflow-wrap:anywhere}.code.legacy{font-size:clamp(24px,8vw,46px)}#room{font-family:Bungee,Impact,sans-serif;text-transform:uppercase;font-size:26px;letter-spacing:.1em}#timeoutFX{position:fixed;inset:0;z-index:100;display:grid;place-items:center;pointer-events:none;background:#050506ed;text-align:center;padding:18px}#timeoutFX .burst{font-size:clamp(100px,35vw,230px);line-height:1.1;animation:fireburst .55s cubic-bezier(.2,.8,.2,1) both}#timeoutFX h2{font-size:clamp(28px,9vw,60px);color:var(--y)}#timeoutFX p{font-size:clamp(19px,5vw,30px);color:var(--m);overflow-wrap:anywhere}@keyframes fireburst{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}@media(prefers-reduced-motion:reduce){#timeoutFX .burst{animation:none}}</style></head><body><main id="app"><section id="home"><h1><span>L</span><span>I</span><span>T</span>!</h1><h2 class="center" style="font-size:22px">Quick wit.<br><span style="color:var(--y)">Share the rare.</span></h2><p class="center" style="font-size:28px;margin:18px">🔥 🤯 🫣 🙌 🏆</p><label for="nickname">Nickname</label><input id="nickname" maxlength="20" autocomplete="nickname" placeholder="Your name"><label for="seconds">Seconds per turn</label><select id="seconds" style="width:100%"><option>10</option><option>15</option><option selected>20</option><option>30</option><option>45</option><option>60</option></select><button id="create" class="primary" style="width:100%;margin:12px 0">Create private room</button><label for="room">Room code</label><div class="row"><input id="room" maxlength="8" autocapitalize="characters" placeholder="4-letter code"><button id="join">Join</button></div><p class="small center" style="margin:20px">A HOODWINKED GAME · PROTOTYPE</p></section><section id="lobby" class="hidden"><h2 class="center">PRIVATE ROOM</h2><div id="code" class="display code center"></div><div id="invitecard"><h3>🔥 Scan to join LIT!</h3><p class="small">(Low-key the easiest way to join.)</p><canvas id="inviteqr" width="240" height="240" role="img" aria-label="QR code for the private room invitation" class="hidden"></canvas><p id="qrstatus" class="small" role="status">Preparing invite…</p><button id="share" style="width:100%">Copy invite link</button></div><div id="lobbyplayers" class="panel" style="margin:12px 0"></div><button id="start" class="primary" style="width:100%">Start game</button><p id="waiting" class="center small">Waiting for the host…</p></section><section id="game" class="hidden"><div class="row small"><span id="round"></span><span class="grow"></span><button id="sound" aria-label="Toggle turn sound" style="min-height:32px;padding:3px 8px">🔇</button></div><h2 id="turn" class="turn" aria-live="polite"></h2><div id="timer" class="timer">20</div><div class="track"><div id="timebar"></div></div><h2 id="question" class="question"></h2><div id="score" class="center small"></div><div id="players" class="playerbar"></div><div class="scroll"><div id="message" class="center" style="color:var(--y)"></div><div id="typing" class="panel typing"></div><div id="reaction" class="center small"></div><div id="history"></div></div><form id="answerform" class="row hidden"><input id="answer" autocomplete="off" autocapitalize="sentences" maxlength="100" enterkeyhint="send" placeholder="Your answer…" aria-label="Your answer"><button class="primary" type="submit">GO</button></form><div id="reactions" class="emoji"></div></section><div id="error" class="err center" role="status"></div><button id="leave" class="hidden" style="min-height:32px;padding:4px 10px;font-size:14px">Back to home</button></main><div id="timeoutFX" class="hidden" role="status" aria-live="assertive"><div><div class="burst">🔥</div><h2>TIME’S UP!</h2><p id="timeoutWho"></p><p id="timeoutHearts"></p></div></div><script type="module">
import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/+esm';
const db=createClient('https://bhcunpwqtcecisckznxw.supabase.co','sb_publishable_0hCQkc_88DhMFdfSmJWaQw_VWYu_0oq');const $=id=>document.getElementById(id);let uid,code='',s=null,channel=null,poll=null,busy=false,typingTimer,turnSeen=-1,sound=false,audio=null,tickBusy=false,roomEpoch=0;
const err=m=>{$('error').textContent=m||''};const hide=(id,b)=>$(id).classList.toggle('hidden',b);function node(tag,text,cls){const x=document.createElement(tag);x.textContent=text;if(cls)x.className=cls;return x}
async function login(){const {data,error}=await db.auth.getSession();if(error)throw error;if(data.session){uid=data.session.user.id;return}const r=await db.auth.signInAnonymously();if(r.error)throw r.error;uid=r.data.user.id}
async function rpc(a,v='',n=20,t=s?.turn||0){const epoch=roomEpoch;const {data,error}=await db.rpc('lit_action',{a,c:code,v,n,t});if(error)throw error;if(epoch!==roomEpoch)return null;if(data){code=data.code;accept(data.state)}return data}
let timeoutSeen=0,fxTimer;function accept(next){if(!next)return;if(s&&next.rev<s.rev)return;const ev=next.timeout_event;if(ev&&ev.id!==timeoutSeen){timeoutSeen=ev.id;if(Date.now()-ev.at<1800&&Date.now()-ev.at>-5000){$('timeoutWho').textContent=ev.player_id===uid?'😭 You lost a life!':'😭 '+ev.player+' lost a life!';$('timeoutHearts').textContent='♥'.repeat(Math.min(ev.lives,8))+'♡'.repeat(Math.max(0,3-ev.lives));hide('timeoutFX',false);clearTimeout(fxTimer);fxTimer=setTimeout(()=>hide('timeoutFX',true),Math.max(0,1600-Math.max(0,Date.now()-ev.at)));if(ev.player_id===uid&&navigator.vibrate)navigator.vibrate([160,60,160])}}s=next;render()}
let qrRoom='',qrLoading=null;
function inviteURL(){const url=new URL(location.href);url.search='';url.hash='';url.searchParams.set('room',code);return url.toString()}
async function showInviteQR(){if(!code||qrRoom===code)return;const room=code,link=inviteURL();qrRoom=room;hide('inviteqr',true);$('qrstatus').textContent='Preparing invite…';try{qrLoading=qrLoading||import('https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/+esm');const mod=await qrLoading;if(code!==room||qrRoom!==room)return;const factory=mod.default;if(typeof factory!=='function')throw Error('QR unavailable');const qr=factory(0,'M');qr.addData(link);qr.make();const count=qr.getModuleCount(),quiet=4,scale=Math.max(1,Math.floor(320/(count+quiet*2))),size=(count+quiet*2)*scale,canvas=$('inviteqr');canvas.width=size;canvas.height=size;const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,size,size);ctx.fillStyle='#000';for(let row=0;row<count;row++)for(let col=0;col<count;col++)if(qr.isDark(row,col))ctx.fillRect((col+quiet)*scale,(row+quiet)*scale,scale,scale);hide('inviteqr',false);$('qrstatus').textContent=''}catch(e){qrLoading=null;if(code===room&&qrRoom===room){$('qrstatus').textContent='QR unavailable — use the room code or invite link.'}}}
function showPlayers(target,lobby=false){const out=$(target);out.replaceChildren();for(const p of s.players){const x=node('div','',lobby?'entry':'player');if(!lobby){x.classList.toggle('on',p.id===s.active);x.classList.toggle('out',p.lives===0)}x.append(node('div',p.name+(p.id===uid?' (you)':'')+(p.id===s.host?' ★':'')),node('div',lobby?'Ready':'♥'.repeat(Math.min(p.lives,8))+(p.lives>8?' +'+(p.lives-8):'')+'♡'.repeat(Math.max(0,3-p.lives)),'hearts'));out.append(x)}}
function cue(){if(navigator.vibrate)navigator.vibrate([100,50,100]);if(sound&&audio){try{const o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=740;g.gain.setValueAtTime(.12,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.2);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+.22)}catch{}}}
function render(){hide('home',true);hide('leave',false);hide('lobby',s.status!=='lobby');hide('game',s.status==='lobby');if(s.status==='lobby'){$('app').dataset.mode='';$('code').textContent=code;$('code').classList.toggle('legacy',code.length>4);showInviteQR();showPlayers('lobbyplayers',true);hide('start',s.host!==uid);$('start').disabled=s.players.length<2;hide('waiting',s.host===uid);return}
const me=s.players.find(p=>p.id===uid),active=s.players.find(p=>p.id===s.active),mine=s.status==='playing'&&s.active===uid,finished=s.status==='finished';$('app').dataset.mode=me?.lives===0?'spectator':mine?'active':'waiting';$('round').textContent=finished?'GAME OVER':'ROUND '+s.round+' · '+(me?.lives===0?'SPECTATING':'');$('turn').textContent=finished?'🏆 '+(s.players.find(p=>p.id===s.winner)?.name||'Nobody')+' WINS!':mine?'YOUR TURN!':(active?.name||'')+'’S TURN';$('question').textContent=finished?'GG! 🙌':s.question;$('score').textContent=me?'♥ '+me.lives+'   ·   '+me.points+' pts   ·   '+me.progress+'/500 next life':'';showPlayers('players');$('message').textContent=(s.message||'')+(s.message?.startsWith('🤯 RARE!')&&s.used.at(-1)?.points===100?' · Low-key legendary.':'');$('typing').textContent=mine?'':(s.typing||'…');hide('typing',mine||finished);hide('answerform',!mine);$('reaction').textContent=s.reaction?s.reaction.emoji+' '+s.reaction.name:'';const h=$('history');h.replaceChildren();for(const a of [...s.used].reverse()){const r=node('div','','entry');r.append(node('span',a.answer+' · '+a.name),node('b','+'+a.points));h.append(r)}if(s.turn!==turnSeen){turnSeen=s.turn;$('answer').value='';clearTimeout(typingTimer);err('');if(mine)cue();else $('answer').blur()}updateClock()}
function updateClock(){if(!s||s.status!=='playing'){$('timer').textContent='—';$('timebar').style.width='0%';return}const left=Math.max(0,s.deadline-Date.now());$('timer').textContent=Math.min(s.seconds,Math.ceil(left/1000));$('timebar').style.width=Math.min(100,left/(s.seconds*10))+'%';if(left===0&&!tickBusy){tickBusy=true;rpc('tick').catch(e=>err(e.message)).finally(()=>setTimeout(()=>tickBusy=false,300))}}
async function connect(){if(channel)await db.removeChannel(channel);clearInterval(poll);channel=db.channel('lit:'+code).on('postgres_changes',{event:'UPDATE',schema:'public',table:'lit_rooms',filter:'code=eq.'+code},p=>accept(p.new.state)).subscribe();poll=setInterval(()=>{if(code)rpc('state').catch(e=>err(e.message))},1800);localStorage.setItem('lit-party-room',code)}
async function enter(a){if(busy)return;busy=true;err('');try{await login();if(a==='join'){code=$('room').value.trim().toUpperCase();if(!/^(?:[A-HJ-NP-Z]{4}|[0-9A-F]{8})$/.test(code))throw Error('Enter the four-letter room code.');}await rpc(a,$('nickname').value.trim(),Number($('seconds').value));await connect()}catch(e){err(e.message)}finally{busy=false}}
$('create').onclick=()=>enter('create');$('join').onclick=()=>enter('join');$('start').onclick=()=>rpc('start').catch(e=>err(e.message));$('share').onclick=async()=>{try{await navigator.clipboard.writeText(inviteURL());err('Invite copied!')}catch{err('Room code: '+code)}};$('leave').onclick=()=>{roomEpoch++;if(channel)db.removeChannel(channel);clearInterval(poll);clearTimeout(typingTimer);localStorage.removeItem('lit-party-room');s=null;code='';qrRoom='';turnSeen=-1;timeoutSeen=0;clearTimeout(fxTimer);hide('timeoutFX',true);$('app').dataset.mode='';hide('game',true);hide('lobby',true);hide('home',false);hide('leave',true);err('')};
$('answer').oninput=()=>{clearTimeout(typingTimer);const t=s?.turn,v=$('answer').value;typingTimer=setTimeout(()=>{if(s?.active===uid&&s.turn===t)rpc('type',v,20,t).catch(e=>err(e.message))},180)};
$('answerform').onsubmit=async e=>{e.preventDefault();if(busy||s?.active!==uid)return;const v=$('answer').value.trim();if(!v)return;clearTimeout(typingTimer);busy=true;try{const r=await rpc('answer',v);if(r?.result==='invalid')err('😩 Not in our answer bank. Try again!');else if(r?.result==='duplicate')err('😩 Already used. Try again!');else err('')}catch(e){err(e.message)}finally{busy=false}};
for(const emoji of ['🔥','🤯','🫣','🫡','😭','😩','🙌','🏆']){const b=node('button',emoji);b.setAttribute('aria-label','React '+emoji);b.onclick=()=>rpc('reaction',emoji).catch(e=>err(e.message));$('reactions').append(b)}
$('sound').onclick=()=>{sound=!sound;$('sound').textContent=sound?'🔊':'🔇';if(sound){audio=audio||new (window.AudioContext||window.webkitAudioContext)();audio.resume()}};
function resize(){const h=window.visualViewport?.height||innerHeight;document.documentElement.style.setProperty('--vh',h+'px');document.body.classList.toggle('compact',h<540)}window.visualViewport?.addEventListener('resize',resize);window.addEventListener('resize',resize);resize();setInterval(updateClock,100);$('room').value=new URLSearchParams(location.search).get('room')||'';const saved=localStorage.getItem('lit-party-room');if(saved&&!$('room').value){(async()=>{try{await login();code=saved;await rpc('state');await connect()}catch{localStorage.removeItem('lit-party-room');code=''}})()}
</script></body></html>
