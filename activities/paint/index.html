<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Paint by Number</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F4EDDC;
    --panel:#FFFDF7;
    --ink:#3E3226;
    --ink-soft:#8C7E68;
    --blue:#4A7A9D;
    --blue-deep:#2F5C7A;
    --rust:#D97A45;
    --mustard:#E3A73A;
    --sage:#8FA678;
    --line:#E5DCC4;
    --cell-size: 14px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:var(--bg);
    background-image:
      radial-gradient(circle at 8% 10%, #EFE2C0 0%, transparent 38%),
      radial-gradient(circle at 92% 88%, #E4ECE0 0%, transparent 42%);
    font-family:'Quicksand', sans-serif;
    color:var(--ink);
    display:flex;
    justify-content:center;
    padding:16px 12px 32px;
  }
  .wrap{
    width:100%;
    max-width:480px;
    display:flex;
    flex-direction:column;
    min-height:calc(100vh - 48px);
  }
  header{text-align:center;margin-bottom:12px;flex-shrink:0;}
  h1{
    font-family:'Baloo 2',sans-serif;
    font-weight:800;
    font-size:clamp(24px,6.5vw,32px);
    margin:0 0 2px;
    color:var(--blue-deep);
    letter-spacing:0.3px;
  }
  header p{margin:0;color:var(--ink-soft);font-weight:600;font-size:13px;}
  .tabs{display:flex;gap:6px;justify-content:center;margin:12px 0 10px;flex-wrap:wrap;flex-shrink:0;}
  .tab{
    border:none;
    background:var(--panel);
    border:2px solid var(--line);
    border-radius:12px;
    padding:7px 13px;
    font-family:'Baloo 2',sans-serif;
    font-weight:600;
    font-size:13px;
    color:var(--ink-soft);
    cursor:pointer;
    transition:transform .15s ease, border-color .15s ease, color .15s ease, background .15s ease;
  }
  .tab.active{
    border-color:var(--rust);
    color:var(--rust);
    background:#FCEFE4;
    transform:translateY(-1px);
  }
  .tab:active{transform:scale(0.96);}
  .card{
    background:var(--panel);
    border-radius:20px;
    padding:14px;
    box-shadow:0 10px 30px rgba(62,50,38,0.10);
    border:1px solid var(--line);
    display:flex;
    flex-direction:column;
    flex:1;
    min-height:0;
  }
  .progress-row{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-shrink:0;}
  .progress-track{flex:1;height:9px;border-radius:6px;background:#EFE6D2;overflow:hidden;}
  .progress-fill{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--rust),var(--mustard));width:0%;transition:width .35s ease;}
  .progress-label{font-size:12px;font-weight:700;color:var(--ink-soft);white-space:nowrap;}
  .palette{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
    justify-content:center;
    margin-bottom:12px;
    flex-shrink:0;
  }
  .swatch{
    width:34px;height:34px;
    border-radius:50%;
    border:3px solid transparent;
    display:flex;align-items:center;justify-content:center;
    font-family:'Baloo 2',sans-serif;
    font-weight:600;
    font-size:12px;
    color:rgba(0,0,0,0.55);
    cursor:pointer;
    transition:transform .15s ease;
  }
  .swatch.selected{
    border-color:var(--blue-deep);
    transform:scale(1.12);
  }
  .swatch.done{opacity:0.35;}
  .swatch:active{transform:scale(0.94);}

  /* ===== GRID - no visible scrollbars ===== */
  .grid-shell{
    width:100%;
    background:#FAF4E6;
    border-radius:12px;
    padding:5px;
    border:1px solid var(--line);
    flex:1;
    min-height:240px;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow-x:auto;
    overflow-y:hidden;
    -webkit-overflow-scrolling:touch;
    /* hide scrollbars completely */
    scrollbar-width:none;
    -ms-overflow-style:none;
  }
  .grid-shell::-webkit-scrollbar{
    display:none;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(var(--cols), var(--cell-size));
    grid-template-rows:repeat(var(--rows), var(--cell-size));
    gap:1px;
    border-radius:6px;
    overflow:hidden;
  }
  .cell{
    display:flex;align-items:center;justify-content:center;
    font-family:'Quicksand', sans-serif;
    font-weight:700;
    user-select:none;
    -webkit-tap-highlight-color:transparent;
    width:var(--cell-size);
    height:var(--cell-size);
    overflow:hidden;
  }
  .cell.empty{background:transparent;}
  .cell.blank{
    background:#FDFAF0;
    color:#C9BC9D;
    font-size:calc(var(--cell-size) * 0.48);
    cursor:pointer;
    border:1px solid #EEE3C8;
  }
  .cell.blank:active{background:#F3E9D2;}
  .cell.filled{
    color:transparent;
    animation:pop .28s ease;
  }
  .cell.shake{animation:shake .3s ease;}
  /* ======================================= */

  @keyframes pop{
    0%{transform:scale(0.55);}
    60%{transform:scale(1.12);}
    100%{transform:scale(1);}
  }
  @keyframes shake{
    0%,100%{transform:translateX(0);}
    25%{transform:translateX(-3px);}
    75%{transform:translateX(3px);}
  }
  .controls{display:flex;justify-content:center;margin-top:12px;flex-shrink:0;}
  .reset-btn{
    border:none;
    background:transparent;
    color:var(--ink-soft);
    font-family:'Quicksand',sans-serif;
    font-weight:700;
    font-size:13px;
    text-decoration:underline;
    cursor:pointer;
    padding:6px 10px;
  }
  .credit{
    text-align:center;
    margin-top:14px;
    font-family:'Quicksand', sans-serif;
    font-weight:600;
    font-size:13px;
    color:var(--ink-soft);
    letter-spacing:0.2px;
    flex-shrink:0;
  }
  .overlay{
    position:fixed;inset:0;
    background:rgba(62,50,38,0.55);
    display:none;
    align-items:center;justify-content:center;
    padding:24px;
    z-index:10;
  }
  .overlay.show{display:flex;}
  .celebrate-card{
    background:var(--panel);
    border-radius:22px;
    padding:28px 24px;
    text-align:center;
    max-width:320px;
    animation:pop .35s ease;
    border:1px solid var(--line);
  }
  .celebrate-card .big{
    width:56px;height:56px;border-radius:50%;
    background:linear-gradient(135deg,var(--rust),var(--mustard));
    margin:0 auto 12px;
  }
  .celebrate-card h2{
    font-family:'Baloo 2',sans-serif;
    margin:0 0 6px;
    font-size:24px;
    color:var(--blue-deep);
  }
  .celebrate-card p{margin:0 0 18px;color:var(--ink-soft);font-weight:600;font-size:14px;}
  .celebrate-card button{
    border:none;
    background:var(--rust);
    color:white;
    font-family:'Baloo 2',sans-serif;
    font-weight:700;
    font-size:15px;
    padding:12px 22px;
    border-radius:14px;
    cursor:pointer;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Paint by Number</h1>
    <p>Tap a color, then tap the matching squares</p>
  </header>
  <div class="tabs" id="tabs"></div>
  <div class="card">
    <div class="progress-row">
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      <div class="progress-label" id="progressLabel">0%</div>
    </div>
    <div class="palette" id="palette"></div>
    <div class="grid-shell" id="gridShell">
      <div class="grid" id="grid"></div>
    </div>
    <div class="controls">
      <button class="reset-btn" id="resetBtn">Clear this picture</button>
    </div>
  </div>
  <div class="credit">❤️ Built with love by Uncle Jon</div>
</div>
<div class="overlay" id="overlay">
  <div class="celebrate-card">
    <div class="big"></div>
    <h2>You did it!</h2>
    <p id="celebrateText">The picture is finished. Nice work!</p>
    <button id="celebrateClose">Done!</button>
  </div>
</div>
