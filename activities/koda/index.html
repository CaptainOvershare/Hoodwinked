<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paint by Number — Koda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F4EDDC; --panel:#FFFDF7; --ink:#3E3226; --ink-soft:#8C7E68;
    --blue-deep:#2F5C7A; --rust:#D97A45; --mustard:#E3A73A; --line:#E5DCC4;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;min-height:100vh;background:var(--bg);
    background-image:
      radial-gradient(circle at 8% 10%, #EFE2C0 0%, transparent 38%),
      radial-gradient(circle at 92% 88%, #E4ECE0 0%, transparent 42%);
    font-family:'Quicksand', sans-serif;color:var(--ink);
    display:flex;justify-content:center;padding:20px 14px 48px;
  }
  .wrap{width:100%;max-width:480px;}
  header{text-align:center;margin-bottom:16px;}
  h1{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:clamp(24px,7vw,32px);margin:0 0 4px;color:var(--blue-deep);}
  header p{margin:0;color:var(--ink-soft);font-weight:600;font-size:13px;}

  .style-tabs{display:flex;justify-content:center;gap:10px;margin:18px 0 14px;}
  .style-tab{
    border:2px solid var(--line);background:var(--panel);border-radius:16px;
    padding:10px 22px;font-family:'Baloo 2',sans-serif;font-weight:700;font-size:15px;
    color:var(--ink-soft);cursor:pointer;transition:all .15s ease;
  }
  .style-tab.active{border-color:var(--blue-deep);color:var(--blue-deep);background:#EAF1F5;transform:translateY(-2px);}

  .card{background:var(--panel);border-radius:22px;padding:16px;box-shadow:0 10px 30px rgba(62,50,38,0.10);border:1px solid var(--line);}
  .progress-row{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
  .progress-track{flex:1;height:10px;border-radius:6px;background:#EFE6D2;overflow:hidden;}
  .progress-fill{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--rust),var(--mustard));width:0%;transition:width .35s ease;}
  .progress-label{font-size:12px;font-weight:700;color:var(--ink-soft);white-space:nowrap;}

  .palette{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:16px;}
  .swatch{
    width:34px;height:34px;border-radius:50%;border:3px solid transparent;
    display:flex;align-items:center;justify-content:center;
    font-family:'Baloo 2',sans-serif;font-weight:600;font-size:12px;color:rgba(0,0,0,0.55);
    cursor:pointer;transition:transform .15s ease;
  }
  .swatch.selected{border-color:var(--blue-deep);transform:scale(1.14);}
  .swatch.done{opacity:0.35;}
  .swatch:active{transform:scale(0.94);}

  .grid-shell{
    width:100%;aspect-ratio: var(--cols) / var(--rows);background:#FAF4E6;
    border-radius:14px;padding:6px;border:1px solid var(--line);container-type:inline-size;
  }
  .grid-shell.previewing, .art-shell.previewing{border:2px solid var(--rust);}
  .grid{display:grid;grid-template-columns:repeat(var(--cols), 1fr);grid-template-rows:repeat(var(--rows), 1fr);width:100%;height:100%;gap:1px;border-radius:8px;overflow:hidden;}
  .cell{display:flex;align-items:center;justify-content:center;font-family:'Quicksand', sans-serif;font-weight:700;user-select:none;-webkit-tap-highlight-color:transparent;min-width:0;min-height:0;overflow:hidden;}
  .cell.empty{background:transparent;}
  .cell.blank{background:#FDFAF0;color:#C9BC9D;font-size:clamp(3px, calc(100cqw / var(--cols) * 0.55), 13px);cursor:pointer;border:1px solid #EEE3C8;}
  .cell.blank:active{background:#F3E9D2;}
  .cell.filled{color:transparent;animation:pop .28s ease;}
  .cell.shake{animation:shake .3s ease;}

  .art-shell{width:100%;background:#FAF4E6;border-radius:14px;border:1px solid var(--line);padding:6px;}
  svg.art-svg{width:100%;height:auto;display:block;}
  .blob{stroke:#C9BC9D;stroke-width:1.2;cursor:pointer;transition:fill .2s ease;}
  .blob.filled{cursor:default;}
  .blob.shake{animation:shake .3s ease;}
  .num-label{font-family:'Quicksand',sans-serif;font-weight:700;fill:#B7A98A;pointer-events:none;text-anchor:middle;dominant-baseline:middle;}
  .num-label.hidden{opacity:0;}

  @keyframes pop{0%{transform:scale(0.55);}60%{transform:scale(1.12);}100%{transform:scale(1);}}
  @keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-3px);}75%{transform:translateX(3px);}}

  .controls{display:flex;justify-content:center;gap:18px;margin-top:16px;flex-wrap:wrap;}
  .reset-btn{border:none;background:transparent;color:var(--ink-soft);font-family:'Quicksand',sans-serif;font-weight:700;font-size:13px;text-decoration:underline;cursor:pointer;padding:6px 10px;}

  .overlay{position:fixed;inset:0;background:rgba(62,50,38,0.55);display:none;align-items:center;justify-content:center;padding:24px;z-index:10;}
  .overlay.show{display:flex;}
  .celebrate-card{background:var(--panel);border-radius:22px;padding:28px 24px;text-align:center;max-width:320px;animation:pop .35s ease;border:1px solid var(--line);}
  .celebrate-card h2{font-family:'Baloo 2',sans-serif;margin:0 0 6px;font-size:24px;color:var(--blue-deep);}
  .celebrate-card p{margin:0 0 18px;color:var(--ink-soft);font-weight:600;font-size:14px;}
  .celebrate-card button{border:none;background:var(--rust);color:white;font-family:'Baloo 2',sans-serif;font-weight:700;font-size:15px;padding:12px 22px;border-radius:14px;cursor:pointer;}

  .credit{text-align:center;margin-top:20px;font-family:'Quicksand', sans-serif;font-weight:600;font-size:13px;color:var(--ink-soft);}
  .hidden-mode{display:none;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Paint by Number — Koda</h1>
    <p>Tap a color, then tap the matching shape</p>
  </header>

  <div class="style-tabs" id="styleTabs">
    <button class="style-tab active" data-mode="squares">Squares</button>
    <button class="style-tab" data-mode="blobs">Blobs</button>
  </div>

  <div class="card">
    <div class="progress-row">
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      <div class="progress-label" id="progressLabel">0%</div>
    </div>
    <div class="palette" id="palette"></div>

    <div class="grid-shell" id="gridShell"><div class="grid" id="grid"></div></div>
    <div class="art-shell hidden-mode" id="artShell"><svg class="art-svg" id="svgRoot"></svg></div>

    <div class="controls">
      <button class="reset-btn" id="resetBtn">Clear this painting</button>
      <button class="reset-btn" id="peekBtn">Peek at the finished painting</button>
    </div>
  </div>
  <div class="credit">❤️ Built with love by Uncle Jon</div>
</div>

<div class="overlay" id="overlay">
  <div class="celebrate-card">
    <h2>You did it!</h2>
    <p id="celebrateText">Koda is fully painted. Nice work!</p>
    <button id="celebrateClose">Done!</button>
  </div>
</div>

KODA_BLOBS.id = 'koda-bl';
KODA_BLOBS.celebrateText = "Koda is fully painted. Nice work!";

// ---------- shared state ----------
let mode = 'squares';
let selectedNum = null;
let previewMode = false;
let filledState = { 'koda-sq': new Set(), 'koda-bl': new Set() };

function activePicture(){ return mode==='squares' ? KODA_SQUARES : KODA_BLOBS; }

const styleTabsEl = document.getElementById('styleTabs');
const paletteEl = document.getElementById('palette');
const gridShellEl = document.getElementById('gridShell');
const gridEl = document.getElementById('grid');
const artShellEl = document.getElementById('artShell');
const svgRoot = document.getElementById('svgRoot');
const progressFill = document.getElementById('progressFill');
const progressLabel = document.getElementById('progressLabel');
const overlay = document.getElementById('overlay');
const resetBtn = document.getElementById('resetBtn');
const peekBtn = document.getElementById('peekBtn');

function totalPaintableSquares(picture){
  let n=0; picture.grid.forEach(row=>row.forEach(v=>{if(v!==0)n++;})); return n;
}

styleTabsEl.querySelectorAll('.style-tab').forEach(btn=>{
  btn.onclick=()=>{
    mode = btn.dataset.mode;
    selectedNum = null; previewMode = false;
    styleTabsEl.querySelectorAll('.style-tab').forEach(b=>b.classList.toggle('active', b===btn));
    gridShellEl.classList.toggle('hidden-mode', mode!=='squares');
    artShellEl.classList.toggle('hidden-mode', mode!=='blobs');
    renderAll();
  };
});

function countRemainingSquares(picture, num, filled){
  let n=0;
  picture.grid.forEach((row,r)=>row.forEach((v,c)=>{ if(v===num && !filled.has(r+'-'+c)) n++; }));
  return n;
}
function countRemainingBlob(picture, num, filled){
  return picture.paths.filter((p,i)=>p.color===num && !filled.has(i)).length;
}

function renderPalette(){
  const picture = activePicture();
  const filled = filledState[picture.id];
  paletteEl.innerHTML='';
  const nums = Object.keys(picture.palette).map(Number).sort((a,b)=>a-b);
  nums.forEach(num=>{
    const remaining = mode==='squares' ? countRemainingSquares(picture,num,filled) : countRemainingBlob(picture,num,filled);
    const sw=document.createElement('div');
    sw.className='swatch'+(selectedNum===num?' selected':'')+(remaining===0?' done':'');
    sw.style.background=picture.palette[num];
    sw.textContent = remaining===0?'✓':num;
    sw.onclick=()=>{
      if(remaining===0) return;
      selectedNum=(selectedNum===num)?null:num;
      renderPalette();
      mode==='squares' ? renderSquares() : renderBlobs();
    };
    paletteEl.appendChild(sw);
  });
}

function renderSquares(){
  const picture = KODA_SQUARES;
  gridEl.style.setProperty('--cols',picture.cols);
  gridEl.style.setProperty('--rows',picture.rows);
  gridShellEl.style.setProperty('--cols',picture.cols);
  gridShellEl.style.setProperty('--rows',picture.rows);
  gridShellEl.classList.toggle('previewing', previewMode);
  gridEl.innerHTML='';
  const filled = filledState[picture.id];
  picture.grid.forEach((row,r)=>{
    row.forEach((v,c)=>{
      const cell=document.createElement('div');
      const key=r+'-'+c;
      if(v===0){ cell.className='cell empty'; }
      else if(previewMode || filled.has(key)){
        cell.className='cell filled'; cell.style.background=picture.palette[v];
      } else {
        cell.className='cell blank'; cell.textContent=v;
        cell.onclick=()=>handleSquareClick(picture,r,c,v,cell);
      }
      gridEl.appendChild(cell);
    });
  });
}
function handleSquareClick(picture,r,c,value,cellEl){
  if(selectedNum===null || value!==selectedNum){
    cellEl.classList.remove('shake'); void cellEl.offsetWidth; cellEl.classList.add('shake'); return;
  }
  filledState[picture.id].add(r+'-'+c);
  renderSquares(); renderPalette(); updateProgress(); checkComplete();
}

function renderBlobs(){
  const picture = KODA_BLOBS;
  svgRoot.setAttribute('viewBox', `0 0 ${picture.viewbox[0]} ${picture.viewbox[1]}`);
  artShellEl.classList.toggle('previewing', previewMode);
  svgRoot.innerHTML='';
  const filled = filledState[picture.id];
  picture.paths.forEach((p,i)=>{
    const isFilled = previewMode || filled.has(i);
    const path=document.createElementNS('http://www.w3.org/2000/svg','path');
    path.setAttribute('d', p.d);
    path.setAttribute('class','blob'+(isFilled?' filled':''));
    path.setAttribute('fill', isFilled ? picture.palette[p.color] : '#FDFAF0');
    if(!previewMode) path.onclick=()=>handleBlobClick(picture,i,p,path);
    svgRoot.appendChild(path);
  });
  picture.paths.forEach((p,i)=>{
    const isFilled = previewMode || filled.has(i);
    const text=document.createElementNS('http://www.w3.org/2000/svg','text');
    text.setAttribute('x', p.cx); text.setAttribute('y', p.cy); text.setAttribute('font-size', 9);
    text.setAttribute('class','num-label'+(isFilled?' hidden':''));
    text.textContent = p.color;
    svgRoot.appendChild(text);
  });
}
function handleBlobClick(picture,i,p,el){
  if(selectedNum===null || p.color!==selectedNum){
    el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); return;
  }
  filledState[picture.id].add(i);
  renderBlobs(); renderPalette(); updateProgress(); checkComplete();
}

function updateProgress(){
  const picture = activePicture();
  const filled = filledState[picture.id];
  const total = mode==='squares' ? totalPaintableSquares(picture) : picture.paths.length;
  const done = filled.size;
  const pct = total===0?0:Math.round((done/total)*100);
  progressFill.style.width=pct+'%';
  progressLabel.textContent=pct+'%';
}
function checkComplete(){
  const picture = activePicture();
  const filled = filledState[picture.id];
  const total = mode==='squares' ? totalPaintableSquares(picture) : picture.paths.length;
  if(filled.size===total){
    document.getElementById('celebrateText').textContent = picture.celebrateText;
    setTimeout(()=>overlay.classList.add('show'),250);
  }
}
resetBtn.onclick=()=>{
  const picture = activePicture();
  filledState[picture.id]=new Set();
  selectedNum=null; previewMode=false;
  renderAll();
};
peekBtn.onclick=()=>{
  previewMode=!previewMode;
  peekBtn.textContent=previewMode?'Back to my painting':'Peek at the finished painting';
  mode==='squares' ? renderSquares() : renderBlobs();
  renderPalette();
};
document.getElementById('celebrateClose').onclick=()=>overlay.classList.remove('show');

function renderAll(){
  renderPalette();
  mode==='squares' ? renderSquares() : renderBlobs();
  updateProgress();
  peekBtn.textContent = previewMode?'Back to my painting':'Peek at the finished painting';
}
renderAll();
</script>
</body>
</html>
